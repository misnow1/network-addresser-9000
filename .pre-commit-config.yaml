repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # docker-compose.release.yml uses Compose's `!reset` tag (see its own
        # comment, and ADR 0009's postscript) — a custom YAML tag that the
        # default constructor-based check can't load, even though the file
        # is syntactically valid. Exclude it here and check it syntax-only
        # below instead of weakening the check for every other YAML file.
        exclude: ^docker-compose\.release\.yml$
      - id: check-yaml
        name: check yaml (syntax-only, for Compose's !reset tag)
        args: [--unsafe]
        files: ^docker-compose\.release\.yml$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # A model change with no accompanying migration is invisible to
      # `manage.py test`: the suite runs against whatever the models say, so
      # it stays green while `makemigrations --check` fails. ci.yml's test
      # job runs the same command, but only after a push -- this runs it at
      # commit time instead. It cost a red CI round trip on ADR 0027 PR 1 to
      # learn that a locally-green suite proves nothing about this.
      #
      # Sources .env when present so a developer gets their real settings,
      # and falls back to DJANGO_DEBUG=true otherwise, because the lint job
      # runs `pre-commit run --all-files` with no .env and no DB service
      # (settings.py's fail-closed SECRET_KEY has a dev fallback under
      # DEBUG). The check needs no database of its own -- an unreachable one
      # is a warning here, not an error.
      - id: django-makemigrations-check
        name: no missing migrations
        entry: >-
          bash -c 'if [ -f .env ]; then set -a; . ./.env; set +a; fi;
          if [ -z "$DJANGO_DEBUG" ]; then export DJANGO_DEBUG=true; fi;
          exec python manage.py makemigrations --check --dry-run'
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        additional_dependencies:
          [Django==6.0.7, django-stubs==6.0.7, mysqlclient==2.2.8, django-auditlog==3.4.1]
        args: [--config-file=pyproject.toml, config, inventory, manage.py]
        pass_filenames: false
        always_run: true
