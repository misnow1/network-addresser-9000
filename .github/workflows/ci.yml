name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded PR runs to save minutes; never cancel a run on `main`,
# since that's the record of what's actually green on the branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # mysqlclient==2.2.8 has no Linux wheels on PyPI (Windows wheels + an
      # sdist only), so it must build from source here too — the mypy
      # pre-commit hook installs it via additional_dependencies.
      - name: Install system build dependencies for mysqlclient
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev build-essential

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: mariadb:11.4.5
        env:
          MARIADB_ROOT_PASSWORD: na9000dev
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -pna9000dev --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20 --health-start-period=30s
    env:
      DJANGO_DEBUG: "true"
      DB_NAME: network_addresser_9000
      DB_USER: root
      DB_PASSWORD: na9000dev
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install system build dependencies for mysqlclient
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev build-essential

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test inventory
